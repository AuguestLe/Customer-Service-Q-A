[project]
name = "ai-customer-chat-api"
version = "0.1.0"
description = "Single-session DeepSeek streaming chat API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "anyio>=4.4,<5",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
